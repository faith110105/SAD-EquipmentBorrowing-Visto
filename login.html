<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Equipment Borrowing System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <h1>Equipment Borrowing System</h1>
    <p>Sign in to manage equipment and borrowing transactions.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required placeholder="you@example.com"></label>
      <label>Password<input id="password" type="password" required placeholder="Password"></label>
      <button class="btn primary full">Login</button>
      <p id="loginMessage" class="message"></p>
    </form>
    <p class="small">Create your test user in Supabase Authentication → Users.</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = document.getElementById("loginMessage");
      message.textContent = "Signing in...";
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });
      if (error) {
        message.textContent = error.message;
        return;
      }
      location.href = "index.html";
    });
  </script>
</body>
</html>
